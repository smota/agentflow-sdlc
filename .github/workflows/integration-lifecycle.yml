name: Integration lifecycle

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-integrated-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Close issues integrated into the configured branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/integration-lifecycle.mjs --apply --receipt "${{ runner.temp }}/agentflow-source-receipts.json"
      - name: Upload source mutation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-source-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/agentflow-source-receipts.json
          if-no-files-found: warn
