name: Nightly full matrix

# validate-pr.yml tiers its checks so a pull request pays only for the evidence it needs, and runs
# the platform-sensitive suites on a reduced matrix. This job is what makes that safe: it runs the
# complete `pnpm validate:release` across every supported operating system and Node major, so a
# regression that only appears on one combination is still caught — within a day rather than on
# every push.
#
# A failure here is a real signal about the trunk, not about a contributor's branch. The last time
# this coverage lapsed, five commits reached development without any pull request and four genuine
# failures sat undetected for ten days.

on:
  schedule:
    # 04:23 UTC. Off the hour, because scheduled workflows queue heavily on the hour.
    - cron: '23 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-full-matrix
  cancel-in-progress: false

jobs:
  full-validation:
    name: Full (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every combination reports independently; one platform failing must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Full release validation
        run: pnpm validate:release
