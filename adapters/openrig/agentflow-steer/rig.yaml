version: '0.2'
name: agentflow-steer
summary: >-
  Subscription-balanced AgentFlow squad. Resolve the pinned distribution for
  model, client, effort and two ordered fallbacks; preserve workflow and
  publication authority.

culture_file: CULTURE.md

docs:
  - path: README.md

permission_policy: 'policies/steer.yaml'

startup:
  files:
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions:
    - type: startup_proof
      value: authenticated
      idempotent: true

pods:
  - id: steer
    label: Steering
    summary: Out-of-rig supervisory steering plane. Reasons and unfreezes; never
      implements.
    members:
      - id: lead
        agent_ref: 'local:agents/agentflow-steer'
        profile: steering-lead
        runtime: codex
        model: gpt-6.1-sol
        effort: medium
        cwd: '.'
        startup:
          files:
            - path: startup/lead.md
              delivery_hint: send_text
              required: true
    edges: []

edges: []
