# AgentFlow steering seat safety guard (Issue #481). Non-steering sessions pass at once.
[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = '''node -e 'const s=process.env.OPENRIG_SESSION_NAME||"";if(!/^steer(?:-[^@\s]+)?@\S+$/.test(s)&&s!=="steer.lead")process.exit(0);const p=require("path").join(require("os").homedir(),".openrig","specs","agentflow-steer","steer-guard.mjs");import(require("url").pathToFileURL(p).href).then(m=>m.runHook()).then(c=>process.exit(c),e=>{console.error("Steering seat guard unavailable: "+e.message);process.exit(2)})''''
timeout = 10
