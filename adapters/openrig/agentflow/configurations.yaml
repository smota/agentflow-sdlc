schema: openrig.bundle-configurations/v1
recommended: balanced-grok-lead

seats:
  # Optional capability registry, not a provisioned member or permission grant.
  dev.test-eng:
    runtimes:
      pi: test-eng-pi
      codex: test-eng
      claude-code: test-eng-claude
  orch.arch:
    runtimes:
      codex: architect
      pi: architect-pi
      claude-code: architect
  dev.build-jr:
    runtimes:
      pi: builder-jr-pi
      claude-code: builder-jr
      codex: builder-jr
  dev.build:
    runtimes:
      pi: builder-pi
      claude-code: builder
      codex: builder
  dev.build-sr:
    runtimes:
      pi: builder-sr-pi
      claude-code: builder-sr
      codex: builder-sr
  dev.qa:
    runtimes:
      pi: qa-pi
      codex: qa
      claude-code: qa
  rev.review:
    runtimes:
      codex: reviewer
      pi: reviewer-pi
      claude-code: reviewer
  eval.tester:
    runtimes:
      codex: eval-tester
      claude-code: eval-tester
      pi: eval-tester-pi

presets:
  balanced-grok-lead:
    orch.arch: pi
    dev.build-jr: claude-code
    dev.build: claude-code
    dev.build-sr: claude-code
    dev.qa: codex
    rev.review: pi

  codex-gemini-grok:
    orch.arch: codex
    dev.build-jr: pi
    dev.build: pi
    dev.build-sr: pi
    dev.qa: pi
    rev.review: codex

  grok-gemini:
    orch.arch: codex
    dev.build-jr: pi
    dev.build: pi
    dev.build-sr: pi
    dev.qa: pi
    rev.review: codex

  inverted-codex-lead:
    orch.arch: codex
    dev.build-jr: codex
    dev.build: codex
    dev.build-sr: codex
    dev.qa: claude-code
    rev.review: pi

  grok-heavy:
    orch.arch: pi
    dev.build-jr: pi
    dev.build: pi
    dev.build-sr: pi
    dev.qa: codex
    rev.review: pi

  claude-heavy:
    orch.arch: claude-code
    dev.build-jr: claude-code
    dev.build: claude-code
    dev.build-sr: claude-code
    dev.qa: codex
    rev.review: claude-code

  codex-heavy:
    orch.arch: codex
    dev.build-jr: codex
    dev.build: codex
    dev.build-sr: codex
    dev.qa: codex
    rev.review: codex

  all-grok:
    orch.arch:
      runtime: pi
      providerRoute: grok
    dev.build-jr:
      runtime: pi
      providerRoute: grok
    dev.build:
      runtime: pi
      providerRoute: grok
    dev.build-sr:
      runtime: pi
      providerRoute: grok
    dev.qa:
      runtime: pi
      providerRoute: grok
    rev.review:
      runtime: pi
      providerRoute: grok

  all-claude:
    eval.tester: claude-code
    orch.arch: claude-code
    dev.build-jr: claude-code
    dev.build: claude-code
    dev.build-sr: claude-code
    dev.qa: claude-code
    rev.review: claude-code

  all-codex:
    eval.tester: codex
    orch.arch: codex
    dev.build-jr: codex
    dev.build: codex
    dev.build-sr: codex
    dev.qa: codex
    rev.review: codex

  frontline:
    orch.arch: codex
    dev.build: pi
    dev.qa: pi
    rev.review: codex

  all-antigravity:
    orch.arch:
      runtime: pi
      providerRoute: antigravity
    dev.build:
      runtime: pi
      providerRoute: antigravity
    dev.qa:
      runtime: pi
      providerRoute: antigravity
    rev.review:
      runtime: pi
      providerRoute: antigravity

effort_policy:
  default_loop_effort: medium
  subagent_search_effort: low
  high_effort_max_context_tokens: 40000
  enforce_clean_subagent_for_high_effort: true
  composite_builder_max_rung: P1

# Built-in tier models and fallback chains have one home in lib/config/execution-defaults.mjs.
# These optional maps contain deliberate bundle overrides, never a copied default matrix.
capability_tiers: {}
fallback_chains: {}
