version: '0.2'
name: agentflow
summary: >
  AgentFlow SDLC delivery squad for parallel, independent development across
  projects with rigorous proof contracts, worktree isolation, dynamic complexity
  matching, Council deliberation, Codex GPT-6.1 Sol lead architecture and review,
  Gemini implementation builders via Pi (Flash Medium, Pro High), and Grok 4.7 Junior builder (Low) and QA (Medium) via Pi.

culture_file: CULTURE.md

docs:
  - path: README.md

startup:
  files:
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions:
    - type: startup_proof
      value: authenticated
      idempotent: true

permission_policy: builtin:yolo
non_interruptive: true

pods:
  - id: orch
    label: Orchestration & Governance
    summary: Architect lead decomposes goals, sets workflow profiles (P0-P4), enforces proof contracts and convenes Council.
    members:
      - id: arch
        agent_ref: 'local:agents/agentflow'
        profile: architect
        runtime: codex
        model: gpt-6.1-sol
        effort: high
        cwd: '.'
        startup:
          files:
            - path: startup/arch-lead.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: dev
    label: Development & Verification
    summary: Capability ladder builders (Jr/Standard/Sr) implement in isolated worktrees; QA validates proof contracts.
    members:
      - id: build-jr
        agent_ref: 'local:agents/agentflow'
        profile: builder-jr-pi
        runtime: pi
        model: grok-cli/grok-4.7
        effort: low
        cwd: '.'
      - id: build
        agent_ref: 'local:agents/agentflow'
        profile: builder-pi
        runtime: pi
        model: antigravity/gemini-3.8-flash
        effort: medium
        cwd: '.'
      - id: build-sr
        agent_ref: 'local:agents/agentflow'
        profile: builder-sr-pi
        runtime: pi
        model: antigravity/gemini-3.1-pro
        effort: high
        cwd: '.'
      - id: qa
        agent_ref: 'local:agents/agentflow'
        profile: qa-pi
        runtime: pi
        model: grok-cli/grok-4.7
        effort: medium
        cwd: '.'
      - id: test-eng
        agent_ref: 'local:agents/agentflow'
        profile: qa-pi
        runtime: pi
        model: grok-cli/grok-4.7
        effort: medium
        cwd: '.'
    edges:
      - kind: delegates_to
        from: build
        to: qa
      - kind: delegates_to
        from: build-jr
        to: qa
      - kind: delegates_to
        from: build-sr
        to: qa
      - kind: delegates_to
        from: build
        to: test-eng
      - kind: delegates_to
        from: build-jr
        to: test-eng
      - kind: delegates_to
        from: build-sr
        to: test-eng

  - id: rev
    label: Independent Audit & Council
    summary: Four-Eyes independent reviewer issues digest-bound verdicts and participates in Council deliberation.
    members:
      - id: review
        agent_ref: 'local:agents/agentflow'
        profile: reviewer
        runtime: codex
        model: gpt-6.1-sol
        effort: high
        cwd: '.'
        startup:
          files:
            - path: startup/review-lead.md
              delivery_hint: send_text
              required: true
    edges: []

edges:
  - kind: delegates_to
    from: orch.arch
    to: dev.build
  - kind: delegates_to
    from: orch.arch
    to: dev.build-jr
  - kind: delegates_to
    from: orch.arch
    to: dev.build-sr
  - kind: delegates_to
    from: dev.build
    to: rev.review
  - kind: delegates_to
    from: dev.build-jr
    to: rev.review
  - kind: delegates_to
    from: dev.build-sr
    to: rev.review
  - kind: can_observe
    from: orch.arch
    to: rev.review
  - kind: can_observe
    from: orch.arch
    to: dev.qa
  - kind: can_observe
    from: rev.review
    to: orch.arch
  - kind: can_observe
    from: orch.arch
    to: dev.build
  - kind: can_observe
    from: orch.arch
    to: dev.build-sr
