version: '0.2'
name: agentflow
summary: >-
  Subscription-balanced AgentFlow squad. Resolve the pinned distribution for
  model, client, effort and two ordered fallbacks; preserve workflow and
  publication authority.

culture_file: CULTURE.md

docs:
  - path: README.md

startup:
  files:
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions:
    - type: startup_proof
      value: authenticated
      idempotent: true

permission_policy: builtin:yolo
non_interruptive: true

pods:
  - id: orch
    label: Orchestration & Governance
    summary: Architect lead decomposes goals, sets workflow profiles (P0-P4), pins
      oracle digests, and convenes clean-context L2 Council subagents.
    members:
      - id: arch
        agent_ref: 'local:agents/agentflow'
        profile: architect
        runtime: codex
        model: gpt-6.1-sol
        effort: medium
        cwd: '.'
        startup:
          files:
            - path: startup/arch-lead.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: dev
    label: Development & Verification
    summary: Primary builder implements in isolated .worktrees/<branch> using L2
      subagents (Composite Phase 3-5 for P0/P1); QA validates P2-P4 and
      high-consequence proof contracts.
    members:
      - id: build
        agent_ref: 'local:agents/agentflow'
        profile: builder-pi
        runtime: pi
        model: antigravity/gemini-3.8-flash
        effort: medium
        cwd: '.'
      - id: qa
        agent_ref: 'local:agents/agentflow'
        profile: qa-pi
        runtime: pi
        model: grok-cli/grok-4.7
        effort: low
        cwd: '.'
    edges:
      - kind: delegates_to
        from: build
        to: qa

  - id: rev
    label: Independent Audit & Council
    summary: Four-Eyes independent reviewer issues digest-bound verdicts and
      dispatches clean-context L2 subagents for P2-P4 deep reasoning.
    members:
      - id: review
        agent_ref: 'local:agents/agentflow'
        profile: reviewer
        runtime: codex
        model: gpt-6-astra
        effort: medium
        cwd: '.'
        startup:
          files:
            - path: startup/review-lead.md
              delivery_hint: send_text
              required: true
    edges: []

  - id: eval
    label: Autonomous Dogfood & Evaluation
    summary: Out-of-band exploratory testing against shipped artifacts and live
      endpoints. Emits backlog findings; never implements or gates PRs.
    members:
      - id: tester
        agent_ref: 'local:agents/agentflow'
        profile: eval-tester-pi
        runtime: pi
        model: antigravity/gemini-3.8-flash
        effort: low
        cwd: '.'
        startup:
          files:
            - path: startup/eval-tester.md
              delivery_hint: send_text
              required: true
    edges: []

edges:
  - kind: delegates_to
    from: orch.arch
    to: dev.build
  - kind: delegates_to
    from: dev.build
    to: rev.review
  - kind: can_observe
    from: orch.arch
    to: rev.review
  - kind: can_observe
    from: orch.arch
    to: dev.qa
  - kind: can_observe
    from: rev.review
    to: orch.arch
  - kind: can_observe
    from: orch.arch
    to: dev.build
  - kind: can_observe
    from: orch.arch
    to: eval.tester
