name: agentflow-seat
version: '1.0'
description: >
  Squad member on the agentflow rig delivering AgentFlow SDLC governance, proof contracts,
  and worktree isolation. The profile selects the role: architect, builder-jr, builder,
  builder-sr, qa, or reviewer.

resources:
  skills:
    - { id: agentflow-auditor, path: skills/agentflow-auditor }
    - { id: agentflow-collaborator, path: skills/agentflow-collaborator }
    - { id: agentflow-designer, path: skills/agentflow-designer }
    - { id: agentflow-maintainer, path: skills/agentflow-maintainer }
    - { id: agentflow-migrator, path: skills/agentflow-migrator }
    - { id: agentflow-orchestrator, path: skills/agentflow-orchestrator }
    - { id: agentflow-scanner, path: skills/agentflow-scanner }
    - { id: developing-openrig, path: skills/developing-openrig }
    - { id: writing-for-agents, path: skills/writing-for-agents }
  runtime_resources:
    - id: claude-activity-hooks
      path: runtime/claude-activity-hooks.json
      runtime: claude-code
      type: claude_activity_hooks

profiles:
  architect:
    summary: Architect Lead governing delivery, complexity ladders, proof contracts, and Council.
    preferences:
      runtime: codex
    uses:
      skills: &arch-skills [agentflow-orchestrator, agentflow-designer, agentflow-scanner]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/architect.md
          delivery_hint: send_text
          required: true
      actions: []

  architect-pi:
    summary: Architect Lead on Pi (Grok 4.7) governing delivery, complexity ladders, and Council.
    preferences:
      runtime: pi
    uses:
      skills: &arch-pi-skills [agentflow-orchestrator, agentflow-designer, agentflow-scanner]
    startup:
      files:
        - path: guidance/architect.md
          delivery_hint: send_text
          required: true
      actions: []

  builder-jr:
    summary: Junior Builder handling linear, low-risk P0 tasks in isolated worktrees.
    preferences:
      runtime: claude-code
    uses:
      skills: &builder-skills [agentflow-collaborator, agentflow-scanner]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/builder-jr.md
          delivery_hint: send_text
          required: true
      actions: []

  builder-jr-pi:
    summary: Junior Builder on Pi handling linear, low-risk P0 tasks in isolated worktrees.
    preferences:
      runtime: pi
    uses:
      skills: &builder-pi-skills [agentflow-collaborator, agentflow-scanner]
    startup:
      files:
        - path: guidance/builder-jr.md
          delivery_hint: send_text
          required: true
      actions: []

  builder:
    summary: Standard Builder handling bilateral P1 features in isolated worktrees.
    preferences:
      runtime: claude-code
    uses:
      skills: *builder-skills
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/builder.md
          delivery_hint: send_text
          required: true
      actions: []

  builder-pi:
    summary: Standard Builder on Pi handling bilateral P1 features in isolated worktrees.
    preferences:
      runtime: pi
    uses:
      skills: *builder-pi-skills
    startup:
      files:
        - path: guidance/builder.md
          delivery_hint: send_text
          required: true
      actions: []

  builder-sr:
    summary: Senior Builder handling complex P2-P3 architectural tasks and Council deliberation.
    preferences:
      runtime: claude-code
    uses:
      skills: *builder-skills
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/builder-sr.md
          delivery_hint: send_text
          required: true
      actions: []

  builder-sr-pi:
    summary: Senior Builder on Pi handling complex P2-P3 architectural tasks and Council deliberation.
    preferences:
      runtime: pi
    uses:
      skills: *builder-pi-skills
    startup:
      files:
        - path: guidance/builder-sr.md
          delivery_hint: send_text
          required: true
      actions: []

  qa:
    summary: QA & Verification Engineer validating proof contracts and automated test suites.
    preferences:
      runtime: codex
    uses:
      skills: *builder-skills
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/qa.md
          delivery_hint: send_text
          required: true
      actions: []

  qa-pi:
    summary: QA & Verification Engineer on Pi validating proof contracts.
    preferences:
      runtime: pi
    uses:
      skills: *builder-pi-skills
    startup:
      files:
        - path: guidance/qa.md
          delivery_hint: send_text
          required: true
      actions: []

  test-eng:
    summary: Test Engineer authoring tests and test oracles in Phase 3/4 before code implementation.
    preferences:
      runtime: codex
    uses:
      skills: *builder-skills
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/test-eng.md
          delivery_hint: send_text
          required: true
      actions: []

  test-eng-claude:
    summary: Optional independent oracle author; requires an explicit source-authorized assignment before execution.
    preferences:
      runtime: claude-code
    uses:
      skills: *builder-skills
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/test-eng.md
          delivery_hint: send_text
          required: true
      actions: []

  test-eng-pi:
    summary: Test Engineer on Pi authoring tests and test oracles in Phase 3/4 before code implementation.
    preferences:
      runtime: pi
    uses:
      skills: *builder-pi-skills
    startup:
      files:
        - path: guidance/test-eng.md
          delivery_hint: send_text
          required: true
      actions: []

  reviewer:
    summary: Independent Reviewer & Auditor enforcing Four-Eyes Principle and Council deliberation.
    preferences:
      runtime: codex
    uses:
      skills: &reviewer-skills [agentflow-auditor, agentflow-scanner]
      runtime_resources: [claude-activity-hooks]
    startup:
      files:
        - path: guidance/reviewer.md
          delivery_hint: send_text
          required: true
      actions: []

  reviewer-pi:
    summary: Independent Reviewer & Auditor on Pi (Grok 4.7) enforcing Four-Eyes and Council.
    preferences:
      runtime: pi
    uses:
      skills: &reviewer-pi-skills [agentflow-auditor, agentflow-scanner]
    startup:
      files:
        - path: guidance/reviewer.md
          delivery_hint: send_text
          required: true
      actions: []

  eval-tester:
    summary: Autonomous exploratory dogfood tester validating shipped artifacts out-of-band and emitting backlog push forces.
    preferences:
      runtime: codex
    uses:
      skills:
        - writing-for-agents
    startup:
      files:
        - path: guidance/eval-tester.md
          delivery_hint: send_text
          required: true
      actions: []

  eval-tester-pi:
    summary: Autonomous exploratory dogfood tester on Pi runtime.
    preferences:
      runtime: pi
    uses:
      skills:
        - writing-for-agents
    startup:
      files:
        - path: guidance/eval-tester.md
          delivery_hint: send_text
          required: true
      actions: []
