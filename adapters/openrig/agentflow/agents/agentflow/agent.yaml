          openrig-operating-model,
          openrig-skills,
          openrig-user,
          orienting-to-an-inherited-seat,
          queue-handoff,
          refocusing,
          retiring-and-inheriting-a-seat,
          seat-continuity-and-handover,
          session-compaction-and-restore,
          software-for-agents,
        ]
    startup:
      files:
        - path: guidance/builder-jr.md
          delivery_hint: send_text
          required: true
      actions: []

  builder:
    summary: Standard Builder handling bilateral P1 features in isolated worktrees.
    preferences:
      runtime: claude-code
    uses:
      skills: *builder-skills
      runtime_resources: [claude-activity-hooks]
    startup:
