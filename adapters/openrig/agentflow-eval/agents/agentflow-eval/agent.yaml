name: agentflow-eval-seat
version: '1.0'
description: >
  Autonomous out-of-band evaluation seat. Exercises shipped products and running services
  against golden journeys and edge-case fuzzing; emits empirical intake findings without
  dirtying worktrees or gating delivery PRs.

profiles:
  eval-tester:
    summary: Autonomous exploratory dogfood tester. Validates shipped artifacts and emits backlog findings.
    preferences:
      runtime: codex
    startup:
      files:
        - path: guidance/role.md
          delivery_hint: send_text
          required: true
      actions: []

  eval-tester-pi:
    summary: High-throughput exploratory dogfood tester on Pi runtime.
    preferences:
      runtime: pi
    startup:
      files:
        - path: guidance/role.md
          delivery_hint: send_text
          required: true
      actions: []
