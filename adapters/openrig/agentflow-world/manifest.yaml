schema: openrig.context-pack/v1
name: agentflow-world
taxonomy: world
description: Canonical L1 AgentFlow SDLC framework law, role ontology, path ownership boundaries, and phase handoff invariants.
atoms:
  - id: operating-model
    region: identity
    source: AGENTS.md#operating-model
    priority: core
    situations:
      - fresh
      - handover
      - post-compaction
    summary: Single-agent default operating model, role-based phases, and distinct runtime platform vs execution target evidence.
    probe:
      prompt: What distinguishes a runtime platform slug from an execution target in AgentFlow?
      expect: Runtime platform names who produced workflow evidence while execution target names how work runs.
      expectedPatterns:
        - runtime platform
        - execution target
  - id: guiding-principles
    region: ontology
    source: docs/guiding-principles.md#2-the-six-guiding-principles
    priority: core
    situations:
      - fresh
      - handover
    summary: Six guiding principles governing deterministic verification, progressive disclosure, and evidence-backed transitions.
    probe:
      prompt: How does AgentFlow treat deterministic CLI verification versus unverified agent claims?
      expect: Deterministic validation and evidence gates take precedence over unverified prose claims.
      expectedPatterns:
        - deterministic
        - evidence
  - id: path-ownership-boundaries
    region: terrain
    source: AGENTS.md#path-ownership-boundaries
    priority: core
    situations:
      - fresh
      - handover
      - post-compaction
    summary: Strict path ownership boundaries for PM, Steering, Builder, and Test Engineering seats, including oracle custody protection.
    probe:
      prompt: Which paths are Builder seats forbidden from modifying and what pin is required before building?
      expect: Builder seats cannot edit tests/oracles/** and require a Phase 3 oracle digest pin.
      expectedPatterns:
        - oracles
        - Phase 3
  - id: two-plane-separation
    region: actors
    source: AGENTS.md#two-plane-separation
    priority: core
    situations:
      - fresh
      - handover
      - post-compaction
    summary: Two-plane separation between the external supervisory steering plane (steer.lead) and worker execution rigs.
    probe:
      prompt: Which plane is authorized to govern goals, unfreeze resolutions, and declare goal completion?
      expect: The external supervisory steering plane (steer.lead) or human operator.
      expectedPatterns:
        - steer.lead
        - supervisory
  - id: workflow-phases
    region: laws
    source: docs/agent-workflow.md#3-workflow-phases
    priority: core
    situations:
      - fresh
      - handover
      - post-compaction
    summary: Governed role-based delivery phases from framing and requirements through architecture, oracle specification, implementation, QA, and review.
    probe:
      prompt: What is the ordered phase sequence in AgentFlow SDLC?
      expect: Framing, requirements, architecture/design, test/oracle specification, implementation, QA, review, and integration.
      expectedPatterns:
        - phase
        - implementation
  - id: role-pass-contract
    region: laws
    source: docs/agent-workflow.md#4-role-pass-contract
    priority: recommended
    situations:
      - fresh
      - handover
    summary: Role-pass evidence contract recording launcher, executor, transport, delegation boundary, and transition outcome.
    probe:
      prompt: What four provenance fields are required on every completed phase role-pass?
      expect: platform/launcher, executor, transport, and delegationBoundary.
      expectedPatterns:
        - executor
        - transport
        - delegationBoundary
  - id: child-work-history
    region: history
    source: docs/issue-standards.md#issue-hierarchy
    priority: recommended
    situations:
      - fresh
      - handover
    summary: Issue hierarchy and child slice history tracking across durable GitHub issues and local goal ledgers.
    probe:
      prompt: How is child slice progress recorded relative to parent goals?
      expect: Durable issue comments, PR bodies, and synchronized goal ledgers track child slice completion.
      expectedPatterns:
        - child
        - issue
  - id: workflow-evidence-state
    region: state
    source: docs/agent-workflow.md#5-workflow-evidence-and-local-artifacts
    priority: core
    situations:
      - fresh
      - handover
      - post-compaction
    summary: Distinction between durable workflow state (issues, PRs, commits, transition envelopes) and ephemeral local scratch state.
    probe:
      prompt: Where does durable workflow state live versus scratch execution state?
      expect: Durable state lives in issue comments, PR bodies, commits, and transition envelopes; .agent-runs/ is local scratch.
      expectedPatterns:
        - durable
        - .agent-runs
  - id: execution-targets-affordances
    region: affordances
    source: docs/execution-targets.md#core-concepts
    priority: core
    situations:
      - fresh
      - handover
    summary: Execution target adapters, CLI vs session vs subagent transports, and wire-agnostic handoff surfaces.
    probe:
      prompt: How should an agent resolve the execution target before launching delegated work?
      expect: From project configuration or an explicit clarifying question, never by silently inheriting the launcher model.
      expectedPatterns:
        - project config
        - execution target
  - id: execution-distributions-affordances
    region: affordances
    source: docs/execution-distributions.md#select-and-inspect
    priority: recommended
    situations:
      - fresh
    summary: Pinned executionDistribution inspection and drift verification via agentflow-sdlc distribution inspect.
    probe:
      prompt: Which command inspects the pinned execution distribution before routing work?
      expect: agentflow-sdlc distribution inspect
      expectedPatterns:
        - distribution inspect
