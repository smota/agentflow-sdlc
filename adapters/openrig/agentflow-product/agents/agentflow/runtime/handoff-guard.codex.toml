# AgentFlow product seat send guard (issue 363). Non-product sessions pass at once.
[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = '''node -e 'const s=process.env.OPENRIG_SESSION_NAME||"";if(!/^pm-[^@\s]+@\S+$/.test(s))process.exit(0);const p=require("path").join(require("os").homedir(),".openrig","specs","agentflow-product","handoff-guard.mjs");import(require("url").pathToFileURL(p).href).then(m=>m.runHook()).then(c=>process.exit(c),e=>{console.error("Product seat send guard unavailable: "+e.message);process.exit(2)})''''
timeout = 10
