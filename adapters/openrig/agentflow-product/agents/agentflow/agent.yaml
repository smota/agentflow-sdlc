name: agentflow-product-seat
version: '1.0'
description: >
  Product squad seat. The profile is the product manager or the analyst.
  Neither profile implements.

profiles:
  product-manager:
    summary: Frames the job, the outcome, and release intent. Propose only.
    preferences:
      runtime: pi
    startup:
      files:
        - path: guidance/manager.md
          delivery_hint: send_text
          required: true
      actions: []
    uses:
      runtime_resources: [handoff-guard-claude, handoff-guard-codex]

  analyst:
    summary: Writes testable acceptance and scope. Propose only.
    preferences:
      runtime: claude-code
    startup:
      files:
        - path: guidance/analyst.md
          delivery_hint: send_text
          required: true
      actions: []
    uses:
      runtime_resources: [handoff-guard-claude, handoff-guard-codex]

# Issue 363: a product seat may not wake a delivery seat directly. The hook runs the guard installed
# with the product base; Pi seats get the same guard as an extension in their own agent directory.
resources:
  runtime_resources:
    - id: handoff-guard-claude
      path: runtime/handoff-guard.claude.json
      runtime: claude-code
      type: claude_settings_fragment
    - id: handoff-guard-codex
      path: runtime/handoff-guard.codex.toml
      runtime: codex
      type: codex_config_fragment
